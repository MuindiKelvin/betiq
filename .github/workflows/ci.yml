name: ci
# Every push and pull request: no secrets committed, unit tests, end-to-end tests against the mock API, production build.
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run check:secrets
      - run: npm test
      - run: npm run test:e2e
      - run: npm run build
