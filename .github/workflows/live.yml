name: live-runner
# Self-restarting live runner. Each run queues the next one as its first step, so there is always one running and one waiting.
# The cron is only a safety net in case the chain is ever broken (GitHub drops many scheduled runs, so it cannot be the main trigger).
# Public repositories only: Actions minutes are free there. A private repo would run out of free minutes within a day.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
concurrency:
  group: live-runner
  cancel-in-progress: false      # the queued run waits for this one to finish; it is never cancelled mid-run
permissions:
  contents: read
  actions: write                 # lets the run queue its successor
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Note start time
        run: echo "T0=$(date +%s)" >> "$GITHUB_ENV"

      - name: Queue the next run first (so the chain survives a failure here)
        run: gh workflow run live.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}"
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci

      - name: Live runner
        run: npm run live
        env:
          BSD_API_KEY: ${{ secrets.BSD_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          LIVE_RUN_MINUTES: "19"
          LIVE_EXIT_IDLE: "1"
          LIVE_REVISIT_MINUTES: "6"
          LIVE_POLL_SECONDS: ${{ vars.LIVE_POLL_SECONDS || '30' }}

      - name: Pace (when idle the runner exits in seconds; hold the slot so runs start at least 5 min apart)
        if: always()
        run: |
          E=$(( $(date +%s) - T0 ))
          if [ "$E" -lt 300 ]; then sleep $(( 300 - E )); fi
